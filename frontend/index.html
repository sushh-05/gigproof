<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GigProof — Social Security Eligibility Checker</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f7f7f9; }
  h1 { color: #1a1a2e; }
  .app-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
  select, input[type="file"] { padding: 8px; }
  button { background: #1a1a2e; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 15px; }
  button:hover { background: #333; }
  #result { margin-top: 25px; padding: 20px; border-radius: 8px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
  .qualify-yes { border-left: 6px solid #2ecc71; }
  .qualify-no { border-left: 6px solid #e67e22; }
  .day-count { font-size: 14px; color: #444; margin: 4px 0; }
  #uploads { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
</style>
</head>
<body>

<h1>GigProof</h1>
<p>Upload a screenshot from each app you work on. We'll check how close you are to qualifying for social security benefits under the 90/120-day rule.</p>

<div id="uploads">
  <div class="app-row">
    <select id="app1"><option>Swiggy</option><option>Zomato</option><option>Uber</option><option>Ola</option><option>Urban Company</option></select>
    <input type="file" id="file1" accept="image/*">
  </div>
  <div class="app-row">
    <select id="app2"><option>Zomato</option><option>Swiggy</option><option>Uber</option><option>Ola</option><option>Urban Company</option></select>
    <input type="file" id="file2" accept="image/*">
  </div>
  <button onclick="checkEligibility()">Check My Eligibility</button>
</div>

<div id="result"></div>

<script>
// MOCK OCR — replace this with real Tesseract.js extraction later.
// For now, this simulates "reading" a screenshot by generating realistic sample dates.
function mockExtractDates(appName, fileSelected) {
  if (!fileSelected) return [];
  const dates = [];
  const numDays = Math.floor(Math.random() * 50) + 20; // pretend we found 20-70 days
  for (let i = 0; i < numDays; i++) {
    const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
    const month = String(Math.floor(Math.random() * 6) + 1).padStart(2, '0');
    dates.push({ app: appName, date: `2026-${month}-${day}` });
  }
  return dates;
}

async function checkEligibility() {
  const app1 = document.getElementById('app1').value;
  const app2 = document.getElementById('app2').value;
  const file1 = document.getElementById('file1').files[0];
  const file2 = document.getElementById('file2').files[0];

  let records = [
    ...mockExtractDates(app1, file1),
    ...mockExtractDates(app2, file2)
  ];

  if (records.length === 0) {
    alert('Please upload at least one screenshot.');
    return;
  }

  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';
  resultDiv.className = '';
  resultDiv.innerHTML = 'Checking...';

  try {
    const response = await fetch('http://127.0.0.1:3000/hello', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records })
    });
    const data = await response.json();

    resultDiv.className = data.qualifies ? 'qualify-yes' : 'qualify-no';
    let html = `<h3>${data.qualifies ? '✅ You qualify' : '⏳ Not yet qualified'}</h3>`;
    html += `<p>${data.message}</p>`;
    html += `<p><strong>Days per app:</strong></p>`;
    for (const app in data.perAppDays) {
      html += `<div class="day-count">${app}: ${data.perAppDays[app]} days</div>`;
    }
    html += `<div class="day-count"><strong>Combined: ${data.combinedDays} days</strong></div>`;
    resultDiv.innerHTML = html;
  } catch (err) {
    resultDiv.innerHTML = 'Error: could not reach the server. Is sam local start-api running?';
  }
}
</script>

</body>
</html>
